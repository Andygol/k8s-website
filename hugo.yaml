baseURL: "https://kubernetes.io"
title: "Kubernetes"
theme:
  - docsy
themesDir: "node_modules"
contentDir: "content/en"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
timeZone: "Etc/UTC"
enableRobotsTXT: true
disableBrowserError: true
disableAliases: true
disableKinds:
  - taxonomy
ignoreFiles:
  - "(?:^|/)OWNERS$"
  - "README[-]+[a-z]*\\.md"
  - "^node_modules$"
  - "content/en/docs/doc-contributor-tools"
timeout: "180s"
enableGitInfo: true

caches:
  assets:
    dir: ":cacheDir/_gen"
    maxAge: -1
  getresource:
    dir: ":cacheDir/:project"
    maxAge: "60s"
  images:
    dir: ":cacheDir/_images"
    maxAge: -1
  modules:
    dir: ":cacheDir/modules"
    maxAge: -1

markup:
  goldmark:
    extensions:
      definitionList: true
      table: true
      typographer: false
    parser:
      attribute: true
      autoHeadingID: true
      autoHeadingIDType: "blackfriday"
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: "emacs"
    tabWidth: 4
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2

frontmatter:
  date:
    - date
    - ":filename"
    - publishDate
    - lastmod

permalinks:
  page:
    blog: "/:section/:year/:month/:day/:slug/"

sitemap:
  filename: "sitemap.xml"
  priority: 0.75

outputs:
  home:
    - HTML
    - RSS
    - HEADERS
    - REDIRECTS
  page:
    - HTML
  section:
    - HTML
    - print

mediaTypes:
  "text/netlify":
    delimiter: ""

outputFormats:
  RSS:
    baseName: "feed"
  HEADERS:
    mediatype: "text/netlify"
    baseName: "_headers"
    isPlainText: true
    notAlternative: true
  REDIRECTS:
    mediatype: "text/netlify"
    baseName: "_redirects"
    isPlainText: true
    notAlternative: true

imaging:
  resampleFilter: "CatmullRom"
  quality: 75
  anchor: "Smart"

services:
  googleAnalytics:
    id: "UA-00000000-0"

params:
  copyright_k8s: "The Kubernetes Authors"
  copyright_linux: "Copyright © 2020 The Linux Foundation ®."
  contribution_guidelines_url: "https://www.kubernetes.dev/docs/contributor-cheatsheet/"
  time_format_blog: "Monday, January 02, 2006"
  time_format_default: "January 02, 2006 at 3:04 PM PST"
  description: "Production-Grade Container Orchestration"
  showedit: true

  latest: "v1.37"
  version: "v1.37"
  githubbranch: "main"
  docsbranch: "main"
  deprecated: false
  url_latest_version: "https://kubernetes.io/docs/home/"
  nextUrl: "https://kubernetes-io-vnext-staging.netlify.com/"
  githubWebsiteRaw: "raw.githubusercontent.com/kubernetes/website"
  github_repo: "https://github.com/kubernetes/website"
  customSearch: true
  search:
    algolia: false
  offlineSearch: false
  cveFeedBucket: "https://storage.googleapis.com/k8s-cve-feed/official-cve-feed.json"
  pushAssets:
    css:
      - callouts
      - styles
    js:
      - script

  versions:
    - version: "v1.37"
      githubbranch: "v1.37.0"
      docsbranch: "main"
      url: "https://kubernetes.io"
    - version: "v1.36"
      githubbranch: "v1.36.0"
      docsbranch: "release-1.36"
      url: "https://v1-36.docs.kubernetes.io"
    - version: "v1.35"
      githubbranch: "v1.35.3"
      docsbranch: "main"
      url: "https://v1-35.docs.kubernetes.io"
    - version: "v1.34"
      githubbranch: "v1.34.6"
      docsbranch: "release-1.34"
      url: "https://v1-34.docs.kubernetes.io"
    - version: "v1.33"
      githubbranch: "v1.33.10"
      docsbranch: "release-1.33"
      url: "https://v1-33.docs.kubernetes.io"

  ui:
    sidebar_resizable: false
    sidebar_menu_compact: false
    ul_show: 3
    sidebar_menu_foldable: true
    sidebar_cache_limit: 1
    breadcrumb_disable: false
    sidebar_search_disable: false
    navbar_logo: true
    footer_about_enable: true
    showLightDarkModeMenu: true
    feedback:
      enable: true
      "yes": 'Glad to hear it! Please <a href="https://github.com/USERNAME/REPOSITORY/issues/new">tell us how we can improve</a>.'
      "no": 'Sorry to hear that. Please <a href="https://github.com/USERNAME/REPOSITORY/issues/new">tell us how we can improve</a>.'
  links:
    user:
      - name_key: "community_youtube_name"
        url: "https://youtube.com/kubernetescommunity"
        icon: "fa-brands fa-youtube"
      - name_key: "community_forum_name"
        url: "https://discuss.kubernetes.io"
        icon: "fa-solid fa-envelope"
      - name_key: "community_server_fault_name"
        url: "https://serverfault.com/questions/tagged/kubernetes"
        icon: "fa-brands fa-stack-overflow"
      - name_key: "community_linkedin_name"
        url: "https://www.linkedin.com/company/kubernetes/"
        icon: "fa-brands fa-linkedin"
      - name_key: "community_bluesky_name"
        url: "https://bsky.app/profile/kubernetes.io"
        icon: "fa-brands fa-bluesky"
      - name_key: "community_x_name"
        url: "https://x.com/kubernetesio"
        icon: "fa-brands fa-x-twitter"
    developer:
      - name_key: "community_contributor_site_name"
        url: "https://k8s.dev/"
        icon: "fa-solid fa-laptop-code"
      - name_key: "community_github_name"
        url: "https://github.com/kubernetes/kubernetes"
        icon: "fa-brands fa-github"
      - name_key: "community_slack_name"
        url: "https://slack.k8s.io"
        icon: "fa-brands fa-slack"
      - name_key: "community_calendar_name"
        url: "https://calendar.google.com/calendar/embed?src=calendar%40kubernetes.io"
        icon: "fa-solid fa-calendar-days"

