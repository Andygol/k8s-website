feature_gate_more_details: "More information about this feature"

feature_gate_more_information_how_to_enable: |-
  <p>To use this feature, you (or a cluster administrator) will need to enable the <a href=\"/docs/reference/command-line-tools-reference/feature-gates/#{{ .feature_gate_name }}\"><tt>{{ .feature_gate_name }}</tt></a> feature gate for all relevant components in your cluster.</p>
  <p>See <a href=\"/docs/tasks/administer-cluster/configure-feature-gates/\">Enable Or Disable Feature Gates</a> for more information.</p>

feature_gate_stable_graduated: "This is a stable feature in {{ .kubernetes }}, and has been since version {{ .stableVersion }}. It was first available in the v{{ .firstReleaseWithThisFeature }} release."

feature_gate_stable_graduated_disabled: "This stable feature gate is disabled by default. You can no longer enable this feature gate to opt in to the associated behavior."

feature_gate_stable_locked: "This is a stable feature in {{ .kubernetes }}, and has been since version v{{ .stableVersion }}. It was first available in the v{{ .firstReleaseWithThisFeature }} release. You can no longer disable or opt out of this feature or behavior (it is locked); if you explicitly set a value for the associated feature gate <tt>{{ .featureGateName }}</tt>, {{ .kubernetes }} ignores it but does not report any error."

feature_gate_removed_after_ga: "This is a stable feature in {{ .kubernetes }}, and has been since the {{ .stableVersion }} release. You can no longer toggle this feature (the associated <a href=\"/docs/reference/command-line-tools-reference/feature-gates-removed/\">feature gate</a> has been removed)."

feature_gate_removed_before_ga_final_version_clear: "{{ .kubernetes }} no longer includes this feature / behavior. The last release of {{ .kubernetes }} that recognized the <tt>{{ .featureGateName }}</tt> feature gate was {{ .toVersion }}. You can no longer toggle that setting."

# Used when we somehow don't know when the feature gate was removed.
feature_gate_removed_before_ga_final_version_unclear: "{{ .kubernetes }} no longer includes this feature / behavior. You can no longer toggle that setting."

