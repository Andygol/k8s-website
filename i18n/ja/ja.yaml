katacoda_message: |-
  <h4>インタラクティブチュートリアルの終了</h4>
  <p>このウェブサイトで以前提供されていたインタラクティブチュートリアルは終了しました。</p>
  <p>Kubernetesは、O'ReillyとKatacodaが長年にわたり、人々がKubernetesを学ぶ最初のステップをサポートしてくださったことに感謝しています。</p>
  <p>この終了は、O'Reilly Mediaによる2019年の<a href="https://www.oreilly.com/content/oreilly-acquires-katacoda-and-a-new-way-for-2-5m-customers-to-learn/">Katacodaの買収</a>に続くものです。</p>
  <hr />
  <p>チュートリアルは<b>2023年3月31日</b>以降機能しなくなりました。この通知が表示されているのは、この特定のページがその終了後まだ更新されていないためです。</p>

