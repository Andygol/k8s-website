thirdparty_message: "Цей розділ містить посилання на проєкти сторонніх розробників, які надають функціонал, необхідний для Kubernetes. Автори проєкту Kubernetes не несуть відповідальності за ці проєкти. Проєкти вказано в алфавітному порядку. Щоб додати проєкт до цього списку, ознайомтеся з <a href=\"/uk/docs/contribute/style/content-guide/#third-party-content\">посібником з контенту</a> перед надсиланням змін. <a href=\"#third-party-content-disclaimer\">Докладніше.</a>"

thirdparty_message_edit_disclaimer: "Поради щодо сторонього вмісту"

thirdparty_message_single_item: "&#128711; Цей елемент посилається на сторонній проєкт або продукт, який не є частиною Kubernetes. <a class=\"alert-more-info\" href=\"#third-party-content-disclaimer\">Докладніше</a>"

thirdparty_message_disclaimer: "<p>Елементи на цій сторінці відносяться до сторонніх продуктів чи проєктів, які надають функціонал, необхідний для Kubernetes. Автори проєкту Kubernetes не несуть відповідальності за ці проєкти. Ознайомтесь з <a href=\"https://github.com/cncf/foundation/blob/master/website-guidelines.md\" target=\"_blank\">настановами на вебсайті CNCF</a> для отримання докладної інформації.</p><p>Ознайомтесь з <a href=\"/uk/docs/contribute/style/content-guide/#third-party-content\">посібником з контенту</a> перед тим, як пропонувати додавання посилання на стороні компоненти.</p>"

thirdparty_message_vendor: "На цій сторінці є посилання на постачальників, які не належать до Kubernetes. Автори проєкту Kubernetes не несуть відповідальності за ці сторонні продукти або проєкти. Для додавання постачальника, продукта або проєкта до цього списку, ознаймтесь з <a href=\"/uk/docs/contribute/style/content-guide/#third-party-content”>настановами щодо вмісту</a> перед додаванням змін. <a href=\"#third-party-content-disclaimer\">Додаткова інформація.</a>"

