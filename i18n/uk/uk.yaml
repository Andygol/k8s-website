katacoda_message: |-
  <h4>Закриття інтерактивних посібників</h4>
  <p>Інтерактивні навчальні посібники, які раніше були на цьому веб-сайті, були закриті.</p>
  <p>Kubernetes вдячний O'Reilly та Katacoda за багаторічну допомогу людям у перших кроках у навчанні Kubernetes.</p>
  <p>Закриття відбулося після того, як O'Reilly Media у 2019 році <a href="https://www.oreilly.com/content/oreilly-acquires-katacoda-and-a-new-way-for-2-5m-customers-to-learn/">придбала</a>
  Katacoda.</p>
  <hr />
  <p>Посібники припинили свою роботу після <b>31<sup>го</sup> березня 2023</b>. Ви бачите це повідомлення, тому що ця конкретна сторінка ще не була оновлена після цього закриття.</p>

