thirdparty_message_single_item: "&#128711; Mục này liên kết đến một dự án hoặc sản phẩm bên thứ ba không phải là một phần của Kubernetes chính. <a class=\"alert-more-info\" href=\"#third-party-content-disclaimer\">Thông tin thêm</a>"

thirdparty_message_disclaimer: "<p>Các mục trên trang này đề cập đến các sản phẩm hoặc dự án bên thứ ba cung cấp chức năng được yêu cầu bởi Kubernetes. Tác giả dự án Kubernetes không chịu trách nhiệm đối với những sản phẩm hoặc dự án của bên thứ ba đó. Xem <a href=\"https://github.com/cncf/foundation/blob/master/website-guidelines.md\" target=\"_blank\">hướng dẫn trang web CNCF</a> để biết thêm chi tiết.</p><p>Bạn nên đọc <a href=\"/docs/contribute/style/content-guide/#third-party-content\">hướng dẫn nội dung</a> trước khi đề xuất một thay đổi thêm một liên kết bên thứ ba nữa.</p>"

thirdparty_message_vendor: "Các mục trên trang này đề cập đến các nhà cung cấp bên ngoài Kubernetes. Tác giả dự án Kubernetes không chịu trách nhiệm đối với những sản phẩm hoặc dự án của bên thứ ba đó. Để thêm một nhà cung cấp, sản phẩm hoặc dự án vào danh sách này, đọc <a href=\"/docs/contribute/style/content-guide/#third-party-content\">hướng dẫn nội dung</a> trước khi gửi thay đổi. <a href=\"#third-party-content-disclaimer\">Thông tin thêm.</a>"

