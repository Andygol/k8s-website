thirdparty_message: "Phần này liên kết đến các dự án bên thứ ba cung cấp chức năng được yêu cầu bởi Kubernetes. Tác giả dự án Kubernetes không chịu trách nhiệm về những dự án này, được liệt kê theo thứ tự chữ cái. Để thêm một dự án vào danh sách này, đọc <a href=\"/docs/contribute/style/content-guide/#third-party-content\">hướng dẫn nội dung</a> trước khi gửi thay đổi. <a href=\"#third-party-content-disclaimer\">Thêm thông tin.</a>"

